# Knative Service template used for every function on the platform.
# Replace <NAME> with the function name (also used as the Harbor repository).
#
#   sed 's/<NAME>/my-func/g' manifests/knative/service-template.yaml | kubectl apply -f -
#
# Invoke through the Kourier NodePort (no LoadBalancer on bare metal):
#   curl -H "Host: <NAME>.default.192.168.1.5.sslip.io" http://192.168.1.5:32491 -d 'payload'
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: <NAME>
  namespace: default
spec:
  template:
    metadata:
      annotations:
        # 0 = scale-to-zero after the stable window (60s) + grace period (30s)
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "10"
    spec:
      # Required: the kubelet needs Harbor robot credentials to pull the image.
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - image: 192.168.1.5/client-demo/<NAME>:latest
          ports:
            - containerPort: 8080
              protocol: TCP
