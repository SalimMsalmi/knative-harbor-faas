# Deployed name: dbconnection (functions/db-query)
# Requires the K8s secret `db-credentials` (see functions/db-query/db-credentials.example.sh)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dbconnection
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "10"
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - image: 192.168.1.5/client-demo/dbconnection:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: host
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
