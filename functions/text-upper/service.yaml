# Deployed name: portal-test-upper (functions/text-upper)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: portal-test-upper
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "10"
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - image: 192.168.1.5/client-demo/portal-test-upper:latest
          ports:
            - containerPort: 8080
              protocol: TCP
